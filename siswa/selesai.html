<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ujian Selesai</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#f4f6f9;

  font-family:Arial,sans-serif;
}

.card{
  width:100%;
  max-width:420px;

  padding:35px 25px;

  background:#fff;
  border-radius:14px;

  text-align:center;

  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.icon{
  font-size:70px;
  margin-bottom:15px;
}

h1{
  font-size:28px;
  color:#2563eb;
  margin-bottom:10px;
}

p{
  font-size:15px;
  color:#374151;
  line-height:1.6;
  margin-bottom:25px;
}

.btn{
  display:inline-block;

  padding:12px 24px;

  background:#2563eb;
  color:#fff;

  border-radius:8px;

  text-decoration:none;
  font-weight:bold;
}

.btn:hover{
  opacity:.9;
}

@media(max-width:600px){

  .card{
    padding:28px 20px;
  }

  h1{
    font-size:24px;
  }

  .icon{
    font-size:60px;
  }

}
</style>
</head>

<body>

<div class="card">

  <div class="icon">
    ✅
  </div>

  <h1>Ujian Selesai</h1>

  <p>
    Jawaban berhasil tersimpan di Firebase.
    <br>
    Terima kasih telah mengikuti ujian.
  </p>

  <a
    href="../login-siswa.html"
    class="btn"
    id="btnLogin"
  >
    Kembali ke Login
  </a>

</div>

<script type="module">

import { db } from "../assets/js/firebase.js";

import {
  doc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const siswaUid =
  sessionStorage.getItem("siswaUid");

document
.getElementById("btnLogin")
.addEventListener("click", async (e) => {

  e.preventDefault();

  try{

    if(siswaUid){

      await setDoc(
        doc(db,"peserta",siswaUid),
        {
          status:"offline",
          lastOnline:serverTimestamp()
        },
        { merge:true }
      );

    }

  }catch(err){

    console.log(err);

  }

  sessionStorage.clear();

  location.href =
    "../login-siswa.html";

});

</script>

</body>
</html>
