<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ujian Selesai</title>

<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin:0; padding:0;
    display:flex; justify-content:center; align-items:center;
    height:100vh;
  }

  .card {
    background:#fff;
    padding:30px 40px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    text-align:center;
    max-width:500px;
  }

  h1 { color:#3b82f6; margin-bottom:20px; }

  .emoji {
    font-size:5rem;
    margin-bottom:20px;
    display:block;
    animation: bounce 1s infinite;
  }

  .status {
    font-size:14px;
    margin-bottom:10px;
  }

  p {
    font-size:1.1rem;
    margin-bottom:30px;
  }

  a.btn {
    display:inline-block;
    background:#3b82f6;
    color:#fff;
    padding:12px 25px;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
  }

  a.btn:hover { background:#2563eb; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
</style>
</head>

<body>

<div class="card">
  <span class="emoji" id="emoji">⏳</span>
  <h1>Ujian Selesai</h1>

  <!-- ✅ STATUS (FIX BUG) -->
  <div id="status" class="status">Memuat...</div>

  <p id="pesan">
    Terima kasih telah menyelesaikan ujian.
  </p>

  <a href="../login-siswa.html" class="btn">
    <i class="fa fa-sign-in"></i> Kembali ke Login
  </a>
</div>

<script type="module">
import { db } from "../assets/js/firebase.js";
import { doc, getDoc, setDoc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const siswaUid  = sessionStorage.getItem("siswaUid");
const kodeUjian = sessionStorage.getItem("kodeUjian");

const emojiEl   = document.getElementById("emoji");
const pesanEl   = document.getElementById("pesan");
const statusEl  = document.getElementById("status");
const koneksiEl = document.getElementById("koneksi");

// ===============================
// 🌐 DETEKSI ONLINE / OFFLINE
// ===============================
function updateKoneksi() {
  if (navigator.onLine) {
    koneksiEl.textContent = "🟢 Online";
    koneksiEl.style.color = "#16a34a";
  } else {
    koneksiEl.textContent = "🔴 Offline";
    koneksiEl.style.color = "#dc2626";

    emojiEl.textContent = "📡";
    statusEl.textContent = "Tidak ada koneksi internet";
    statusEl.style.color = "#dc2626";

    pesanEl.innerHTML = `
      Perangkat kamu sedang offline.<br>
      Pastikan internet aktif untuk melihat nilai.
    `;
  }
}

// jalankan awal
updateKoneksi();

// listener perubahan koneksi
window.addEventListener("online", updateKoneksi);
window.addEventListener("offline", updateKoneksi);

// ===============================
// 🔄 LOADING AWAL
// ===============================
emojiEl.textContent = "⏳";
statusEl.textContent = "Memverifikasi jawaban di server...";
statusEl.style.color = "#f59e0b";

if (!siswaUid || !kodeUjian) {
  window.location.href = "../login-siswa.html";
}

// ⛔ kalau offline, hentikan proses
if (!navigator.onLine) {
  throw new Error("Offline mode");
}

// ⏳ delay
await new Promise(r => setTimeout(r, 1000));

try {
  const ref = doc(db, "jawaban_siswa", `${siswaUid}_${kodeUjian}`);
  const snap = await getDoc(ref);

  if (snap.exists()) {
    const data = snap.data();

    console.log("DATA FIRESTORE:", data);

    statusEl.textContent = "✅ Jawaban tersimpan";
    statusEl.style.color = "#16a34a";

    let skor = 0;
    let totalSoal = 0;
    let benar = 0;

    const jawaban = data.detailJawaban || data.jawaban || null;

    if (jawaban) {

      if (Array.isArray(jawaban)) {
        totalSoal = jawaban.length;
        benar = jawaban.filter(j => j.benar === true).length;
      }

      else if (typeof jawaban === "object") {
        const list = Object.values(jawaban);
        totalSoal = list.length;
        benar = list.filter(j => j.benar === true).length;
      }

      if (totalSoal > 0) {
        skor = (benar / totalSoal) * 100;
      }
    }

    if (skor === 0 && data.totalNilai != null) {
      skor = Number(data.totalNilai);
    }

    if (isNaN(skor)) {
      emojiEl.textContent = "⚠️";
      pesanEl.innerHTML = "Nilai belum tersedia.";
      return;
    }

    // 🎯 EMOJI
    if (skor < 50) {
      emojiEl.textContent = "😢";
    } else if (skor <= 75) {
      emojiEl.textContent = "🙂";
    } else {
      emojiEl.textContent = "😄";
    }

    pesanEl.innerHTML = `
      Terima kasih telah mengikuti ujian.<br><br>
      Jumlah soal: <b>${totalSoal}</b><br>
      Jawaban benar: <b>${benar}</b><br>
      Nilai kamu: <b>${Math.round(skor)}</b>
    `;

  } else {
    emojiEl.textContent = "⚠️";
    statusEl.textContent = "❌ Data tidak ditemukan";
    statusEl.style.color = "#dc2626";

    pesanEl.innerHTML = `
      Jawaban tidak ditemukan.<br>
      Hubungi guru / pengawas.
    `;
  }

} catch (err) {
  console.error("ERROR:", err);

  if (!navigator.onLine) return;

  emojiEl.textContent = "❌";
  statusEl.textContent = "Gagal mengambil data";
  statusEl.style.color = "#dc2626";

  pesanEl.innerHTML = "Terjadi kesalahan koneksi ke server.";
}
const btnLogin = document.querySelector("a.btn");

btnLogin.addEventListener("click", async (e) => {
  e.preventDefault(); // tahan dulu pindah halaman

  try {
    if (siswaUid) {
      await setDoc(doc(db, "peserta", siswaUid), {
        status: "offline",
        lastOnline: serverTimestamp()
      }, { merge: true });
    }
  } catch (err) {
    console.error("Gagal update status offline:", err);
  }

  // setelah update baru pindah halaman
  window.location.href = "../login-siswa.html";
});
</script>

</body>
</html>
