<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ujian Selesai</title>

<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  background:#fff;
  padding:30px 40px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
  text-align:center;
  max-width:500px;
}

h1 { color:#3b82f6; }

.emoji {
  font-size:5rem;
  margin-bottom:15px;
  display:block;
  animation: bounce 1s infinite;
}

.status {
  font-size:14px;
  margin-bottom:8px;
}

a.btn {
  display:inline-block;
  background:#3b82f6;
  color:#fff;
  padding:12px 25px;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
</style>
</head>

<body>

<div class="card">
  <span class="emoji" id="emoji">⏳</span>
  <h1>Ujian Selesai</h1>

  <div id="status" class="status">Memuat...</div>
  <div id="koneksi" class="status"></div>

  <p id="pesan">Memproses data...</p>

  <a href="../login-siswa.html" class="btn">
    <i class="fa fa-sign-in"></i> Kembali ke Login
  </a>
</div>

<script type="module">
import { db } from "../assets/js/firebase.js";
import { doc, getDoc, setDoc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const siswaUid  = sessionStorage.getItem("siswaUid");
const kodeUjian = sessionStorage.getItem("kodeUjian");

const emojiEl   = document.getElementById("emoji");
const pesanEl   = document.getElementById("pesan");
const statusEl  = document.getElementById("status");
const koneksiEl = document.getElementById("koneksi");

// ================= KONEKSI =================
function updateKoneksi() {
  if (!koneksiEl) return;

  if (navigator.onLine) {
    koneksiEl.textContent = "🟢 Online";
    koneksiEl.style.color = "#16a34a";
  } else {
    koneksiEl.textContent = "🔴 Offline";
    koneksiEl.style.color = "#dc2626";

    emojiEl.textContent = "📡";
    statusEl.textContent = "Tidak ada koneksi internet";
    statusEl.style.color = "#dc2626";

    pesanEl.innerHTML = `
      Perangkat offline.<br>
      Aktifkan internet untuk melihat hasil.
    `;
  }
}

updateKoneksi();
window.addEventListener("online", updateKoneksi);
window.addEventListener("offline", updateKoneksi);

// ================= VALIDASI =================
if (!siswaUid || !kodeUjian) {
  location.href = "../login-siswa.html";
}
if (localStorage.getItem(`sudah_kirim_${siswaUid}_${kodeUjian}`) !== "true") {

  emojiEl.textContent = "⚠️";
  statusEl.textContent = "Ujian belum selesai";
  statusEl.style.color = "#dc2626";

  pesanEl.innerHTML = `
    Data ujian belum lengkap.<br>
    Silakan kembali ke halaman ujian.
  `;

  return;
}
// ================= LOADING =================
emojiEl.textContent = "⏳";
statusEl.textContent = "Memverifikasi jawaban...";
statusEl.style.color = "#f59e0b";

// ================= AMBIL DATA (ANTI STUCK) =================
async function ambilData() {
  try {
    const ref = doc(db, "jawaban_siswa", `${siswaUid}_${kodeUjian}`);

    let snap;
    let retry = 0;

    // 🔁 retry max 5x
    while (retry < 5) {
      snap = await getDoc(ref);
      if (snap.exists()) break;

      await new Promise(r => setTimeout(r, 1000));
      retry++;
    }

    // ❌ masih tidak ada
    if (!snap || !snap.exists()) {
      emojiEl.textContent = "⚠️";
      statusEl.textContent = "Data tidak ditemukan";
      statusEl.style.color = "#dc2626";

      pesanEl.innerHTML = `
        Jawaban belum masuk ke server.<br>
        Silakan hubungi guru.
      `;
      return;
    }

    const data = snap.data();

    statusEl.textContent = "✅ Jawaban tersimpan";
    statusEl.style.color = "#16a34a";

let skorPG = Number(data.nilaiPG || 0);

// ✅ cek apakah ada jawaban essay
const adaEssay =
  Object.keys(data.jawabanEssay || {}).length > 0;

// ✅ jika ada essay & nilai PG masih 0
if (
  adaEssay &&
  data.nilaiEssay === 0 &&
  skorPG === 0
) {

  emojiEl.textContent = "📝";

  pesanEl.innerHTML = `
    Terima kasih telah mengikuti ujian.<br><br>
    Jawaban essay berhasil dikirim.<br>
    Nilai essay akan diisi oleh guru.
  `;

} else {
  // 🎯 EMOJI BERDASARKAN NILAI PG
  if (skorPG < 50) {
    emojiEl.textContent = "😢";
  } else if (skorPG <= 75) {
    emojiEl.textContent = "🙂";
  } else {
    emojiEl.textContent = "😄";
  }

  pesanEl.innerHTML = `
  Terima kasih telah mengikuti ujian.<br><br>

  Nilai PG Kamu: <b>${skorPG}</b><br>
  Nilai essay akan diisi oleh guru.
`;
}

  } catch (err) {
    console.error(err);

    emojiEl.textContent = "❌";
    statusEl.textContent = "Gagal mengambil data";
    statusEl.style.color = "#dc2626";

    pesanEl.textContent = "Terjadi kesalahan koneksi.";
  }
}

await new Promise(r => setTimeout(r, 800));
await ambilData();

// ================= UPDATE STATUS =================
document.querySelector("a.btn").addEventListener("click", async (e) => {
  e.preventDefault();

  try {
    await setDoc(doc(db, "peserta", siswaUid), {
      status: "offline",
      lastOnline: serverTimestamp()
    }, { merge: true });
  } catch {}

  sessionStorage.clear();
 location.href = "../login-siswa.html";
});
</script>

</body>
</html>
